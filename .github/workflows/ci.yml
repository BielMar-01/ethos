name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas da mesma branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Instalar dependências
        run: npm ci && npm --prefix client ci

      - name: Tipos do servidor
        run: npx tsc --noEmit

      - name: Lint da interface
        run: npm --prefix client run lint

      # Os testes usam Postgres em memória (PGlite): não precisam de segredos nem tocam o Supabase.
      - name: Testes
        run: npm test

      - name: Build (servidor + interface)
        run: npm run build

  # Testes de ponta a ponta em navegador real (Chromium) sobre o modo demonstração (memória; não toca o Supabase).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Instalar dependências
        run: npm ci && npm --prefix client ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build (o demo serve client/dist)
        run: npm run build

      - name: Testes E2E
        run: npx playwright test

      - name: Relatório do Playwright (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
