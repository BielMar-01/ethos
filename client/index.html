<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ethos — Administração de imóveis</title>
    <meta
      name="description"
      content="Cadastros, contratos, cobranças, vistorias e manutenção em um só lugar, com área própria para inquilinos e proprietários."
    />
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="Ethos — Administração de imóveis" />
    <meta
      property="og:description"
      content="Cadastros, contratos, cobranças, vistorias e manutenção em um só lugar, com área própria para inquilinos e proprietários."
    />
    <meta property="og:type" content="website" />
    <!-- Aplica o tema salvo ANTES da primeira pintura (evita o "flash" de tema errado). -->
    <script>
      try {
        var t = localStorage.getItem('ethos-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
